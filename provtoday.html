<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>箴的懂了嗎？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
/* ============================================================
   每日箴言尋寶  —  Proverbs Treasure Hunt
   一個給國中生的每日讀箴言打卡 / 答題 / 小組PK 平台

   ★ 老師只要改這裡：搜尋 "CONFIG" 區塊（在最下方 <script> 開頭）
   ★ 放到你的 github.io 就能用；雲端同步是下一步
   ============================================================ */

:root{
  /* 羊皮紙 + 智慧金 + 夜藍 —— 「尋寶 / 智慧」的世界 */
  --bg:        #F5EEDD;   /* 羊皮紙底 */
  --surface:   #FFFDF6;   /* 卡片 */
  --surface-2: #EFE6CE;   /* 次級面 */
  --ink:       #26243A;   /* 深墨藍字 */
  --ink-soft:  #6A6580;   /* 次要字 */
  --line:      #E2D6B8;   /* 分隔線 */
  --gold:      #C48A16;   /* 金 (主色) */
  --gold-soft: #F0DCA6;   /* 金淡底 */
  --sage:      #5F7E56;   /* 成長綠 */
  --fire:      #E4622E;   /* 連續打卡火 */
  --wrong:     #B24A55;   /* 答錯 */
  --shadow:    0 6px 22px rgba(60,45,10,.10);
  --shadow-lg: 0 14px 40px rgba(60,45,10,.16);
  --r:         18px;
  --serif: "Noto Serif TC", "Songti TC", serif;
  --sans:  "Noto Sans TC", system-ui, -apple-system, "PingFang TC", sans-serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:        #14131F;
    --surface:   #1E1C2C;
    --surface-2: #262338;
    --ink:       #F3ECDA;
    --ink-soft:  #A49FBB;
    --line:      #322E45;
    --gold:      #E8B84B;
    --gold-soft: #3A3020;
    --sage:      #93B885;
    --fire:      #FF7A44;
    --wrong:     #E68793;
    --shadow:    0 6px 22px rgba(0,0,0,.34);
    --shadow-lg: 0 16px 44px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:        #14131F;
  --surface:   #1E1C2C;
  --surface-2: #262338;
  --ink:       #F3ECDA;
  --ink-soft:  #A49FBB;
  --line:      #322E45;
  --gold:      #E8B84B;
  --gold-soft: #3A3020;
  --sage:      #93B885;
  --fire:      #FF7A44;
  --wrong:     #E68793;
  --shadow:    0 6px 22px rgba(0,0,0,.34);
  --shadow-lg: 0 16px 44px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  padding-bottom:88px; /* 給底部導覽留位 */
}
.wrap{max-width:460px;margin:0 auto;padding:0 16px;padding-block:0}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--ink-soft)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- 頂部標頭 ---------- */
header.top{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--bg) 70%,transparent);
  backdrop-filter:blur(6px);
}
.top-inner{
  display:flex;align-items:center;gap:10px;
  padding:14px 0 10px;
}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand .logo{font-size:24px;line-height:1}
.brand .name{font-family:var(--serif);font-weight:900;font-size:17px;letter-spacing:.5px;white-space:nowrap}
.brand .sub{font-size:11px;color:var(--ink-soft);margin-top:-2px}
.icon-btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  width:38px;height:38px;border-radius:12px;font-size:16px;display:grid;place-items:center;
  transition:transform .12s;
}
.icon-btn:active{transform:scale(.92)}

/* ---------- 我的狀態列 (火苗 / 分數 / 等級) ---------- */
.stats{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:2px;
}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:10px 8px;text-align:center;box-shadow:var(--shadow);
}
.stat .big{font-family:var(--serif);font-weight:900;font-size:22px;line-height:1.1;display:flex;align-items:center;justify-content:center;gap:3px}
.stat .lab{font-size:11px;color:var(--ink-soft);margin-top:1px}
.stat.fire .big{color:var(--fire)}
.stat.pts  .big{color:var(--gold)}
.stat.lv   .big{color:var(--sage);font-size:16px;padding-top:3px}

/* ---------- 分頁切換 ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);
  padding:8px 0 max(8px,env(safe-area-inset-bottom));
  box-shadow:0 -6px 22px rgba(60,45,10,.08);
}
.tabs-inner{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{
  border:none;background:none;color:var(--ink-soft);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;font-size:11px;font-weight:500;transition:color .15s;
}
.tab .ic{font-size:20px;line-height:1}
.tab[aria-selected="true"]{color:var(--gold);font-weight:700}
.tab[aria-selected="true"] .ic{transform:translateY(-1px)}

/* ---------- 通用卡片 ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow);margin-top:14px;
}
.eyebrow{
  font-size:12px;font-weight:700;letter-spacing:2px;color:var(--gold);
  text-transform:uppercase;display:flex;align-items:center;gap:7px;
}
.section-title{font-family:var(--serif);font-weight:700;font-size:20px;margin-top:16px;margin-bottom:2px}

/* ---------- 今日題目卡 ---------- */
.q-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.q-day{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--gold)}
.q-chapter{font-size:12px;color:var(--ink-soft)}
.q-text{
  font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.5;
  margin:12px 0 4px;
}
.q-text-en{font-family:var(--sans);font-weight:500;font-size:14.5px;color:var(--ink-soft);line-height:1.5;margin:2px 0 4px}
.opt-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.opt-en{font-size:12.5px;color:var(--ink-soft);font-weight:400;line-height:1.3}
.txt-en{font-family:var(--serif);font-size:14px;color:var(--ink-soft);line-height:1.6;margin-top:8px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;
  padding:14px 14px;font-size:16px;color:var(--ink);font-weight:500;
  transition:border-color .12s,background .12s,transform .1s;
}
.opt:active{transform:scale(.99)}
.opt .key{
  flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--ink-soft);
}
.opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.opt.sel .key{background:var(--gold);color:#fff;border-color:var(--gold)}
.opt.correct{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 16%,transparent)}
.opt.correct .key{background:var(--sage);color:#fff;border-color:var(--sage)}
.opt.wrong{border-color:var(--wrong);background:color-mix(in srgb,var(--wrong) 14%,transparent)}
.opt.wrong .key{background:var(--wrong);color:#fff;border-color:var(--wrong)}
.opt[disabled]{cursor:default}
.opt .mark{margin-left:auto;font-size:18px}

.btn{
  width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;
  background:var(--gold);color:#fff;margin-top:16px;box-shadow:var(--shadow);
  transition:transform .1s,opacity .15s;
}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}

/* ---------- 揭曉區 ---------- */
.reveal{margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.verdict{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.verdict.ok{color:var(--sage)}
.verdict.no{color:var(--wrong)}
.gained{margin-left:auto;font-size:13px;color:var(--gold);font-weight:700}
.verse{
  font-family:var(--serif);background:var(--gold-soft);border-radius:14px;padding:14px 16px;margin-top:12px;
  border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);
}
.verse .ref{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:1px}
.verse .txt{font-size:16px;line-height:1.7;margin-top:5px}
.reflect{margin-top:14px}
.reflect label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
.reflect .hint{font-size:12px;color:var(--ink-soft);font-weight:400;margin-left:6px}
textarea{
  width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);
  color:var(--ink);font-family:inherit;font-size:15px;padding:11px;resize:vertical;min-height:70px;
}
textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.saved-tag{font-size:12px;color:var(--sage);font-weight:600;margin-top:6px;display:none}
.saved-tag.show{display:block}

/* ---------- 進度 / 補讀清單 ---------- */
.days{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.day-chip{
  width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:var(--ink-soft);line-height:1;gap:1px;
  transition:transform .1s;
}
.day-chip:active{transform:scale(.94)}
.day-chip .dl{font-size:9px;font-weight:500}
.day-chip.done{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 14%,transparent);color:var(--sage)}
.day-chip.today{border-color:var(--gold);background:var(--gold-soft);color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.day-chip.locked{opacity:.42}
.day-chip.today.done{border-color:var(--sage)}

/* ---------- 徽章 ---------- */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:10px;margin-top:14px}
.badge{
  background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  padding:12px 8px;text-align:center;position:relative;
}
.badge .em{font-size:30px;line-height:1;filter:grayscale(1);opacity:.35;transition:.2s}
.badge.on .em{filter:none;opacity:1;transform:scale(1.05)}
.badge .bn{font-size:12px;font-weight:700;margin-top:6px}
.badge .bd{font-size:10px;color:var(--ink-soft);margin-top:1px;line-height:1.3}
.badge.on{border-color:var(--gold);background:var(--gold-soft)}

/* ---------- 等級進度條 ---------- */
.level-box{display:flex;align-items:center;gap:14px}
.level-em{font-size:40px;line-height:1}
.level-meta{flex:1;min-width:0}
.level-name{font-family:var(--serif);font-weight:900;font-size:19px}
.bar{height:9px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--gold));border-radius:99px;transition:width .5s}
.level-next{font-size:11px;color:var(--ink-soft);margin-top:5px}

/* ---------- 排行榜 ---------- */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:14px;gap:4px}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:9px;font-weight:700;font-size:14px;color:var(--ink-soft)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--gold);box-shadow:var(--shadow)}
.demo-note{font-size:11.5px;color:var(--ink-soft);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:8px 11px;margin-top:12px}
.row{
  display:flex;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none}
.rank{width:26px;text-align:center;font-family:var(--serif);font-weight:900;font-size:17px;color:var(--ink-soft)}
.rank.g1{color:#E0A400}.rank.g2{color:#9AA0AE}.rank.g3{color:#C08552}
.who{flex:1;min-width:0}
.who .nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .tm{font-size:11px;color:var(--ink-soft)}
.row .pts{font-family:var(--serif);font-weight:900;color:var(--gold);font-size:16px}
.row .st{font-size:11px;color:var(--fire);text-align:right}
.row.me{background:var(--gold-soft);border-radius:12px;margin:2px 0;border-bottom:none}
.team-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:7px;border:1px solid var(--line)}
.team-bar > i{display:block;height:100%;border-radius:99px}
.team-row{padding:14px 8px;border-bottom:1px solid var(--line)}
.team-row:last-child{border-bottom:none}
.team-top{display:flex;align-items:center;gap:10px}
.team-medal{font-size:22px}
.team-name{font-weight:700;flex:1}
.team-pts{font-family:var(--serif);font-weight:900;color:var(--gold)}
.team-sub{font-size:11px;color:var(--ink-soft);margin-top:3px}

/* ---------- 對話框 / 覆蓋層 ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(20,15,5,.55);
  display:none;align-items:flex-end;justify-content:center;
}
.overlay.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  background:var(--surface);width:100%;max-width:460px;border-radius:22px 22px 0 0;
  padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);
  max-height:90vh;overflow:auto;animation:slideup .28s ease both;
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet h2{font-family:var(--serif);font-size:22px;font-weight:900}
.sheet p.lead{color:var(--ink-soft);font-size:14px;margin:6px 0 16px}
.field{margin-bottom:14px}
.field label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
.input{
  width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);
  color:var(--ink);font-family:inherit;font-size:16px;padding:12px;
}
.input:focus{outline:2px solid var(--gold);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-pick{
  border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:99px;padding:9px 15px;font-size:14px;font-weight:600;
}
.chip-pick[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.chips.grp{flex-direction:column;gap:10px}
.chips.grp .chip-pick{border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:700}
.chip-sub{font-size:12px;color:var(--ink-soft);font-weight:500}
.chip-pick[aria-pressed="true"] .chip-sub{color:var(--gold)}
.name-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.name-pick{border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:14px;padding:13px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s,border-color .12s}
.name-pick:active{transform:scale(.96)}
.name-pick:hover{border-color:var(--gold)}
.name-pick b{font-size:16px;font-weight:700}
.name-pick span{font-size:12px;color:var(--ink-soft)}
.link-back{border:none;background:none;color:var(--ink-soft);font-size:13px;padding:0 0 6px;cursor:pointer}
.vt-entry{margin-top:18px;width:100%;border:1px dashed var(--line);background:transparent;color:var(--ink-soft);border-radius:12px;padding:12px;font-size:13px;font-weight:600;cursor:pointer}
.vt-entry:hover{border-color:var(--gold);color:var(--gold)}
.nf-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.mem-wrap{display:flex;flex-wrap:wrap;gap:6px}
.mem-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 11px;font-size:13px;font-weight:600}
.mem-chip i{font-style:normal;color:var(--ink-soft);font-weight:400;font-size:12px}
.mem-chip button{border:none;background:var(--line);color:var(--ink);width:18px;height:18px;border-radius:50%;font-size:13px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
.mem-chip button:hover{background:var(--wrong);color:#fff}
/* 教師看板 */
.vt-sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.vt-s{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.vt-s b{font-family:var(--serif);font-size:22px;display:block;line-height:1.1}
.vt-s span{font-size:11px;color:var(--ink-soft)}
.vt-group{margin-bottom:12px}
.vt-gname{font-weight:700;font-size:13px;color:var(--gold);letter-spacing:.5px;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.vt-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 2px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.vt-row:last-child{border-bottom:none}
.vt-row.off{opacity:.55}
.vt-nm{font-weight:700;font-size:14px}
.vt-st{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.vt-ok{color:var(--sage);font-size:11px;font-weight:700}
.vt-no{color:var(--fire);font-size:11px;font-weight:700}
.vt-tag{font-size:11px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.vt-banner{margin-top:12px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 34%,transparent);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vt-banner button{margin-left:auto;border:none;background:var(--gold);color:#fff;border-radius:99px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}

/* ---------- 慶祝 ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;display:none}

/* ---------- 管理面板 ---------- */
.admin-q{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.admin-q .r1{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.admin-q .r1 .d{font-weight:900;color:var(--gold);font-family:var(--serif)}
.small{font-size:12px}
.opt-edit{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.opt-edit input[type=text]{flex:1}
.opt-edit .input{padding:8px 10px;font-size:14px}
.opt-edit input[type=radio]{width:20px;height:20px;accent-color:var(--sage)}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0}

.empty{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:14px}
.empty .em{font-size:40px;display:block;margin-bottom:8px}

.footnote{text-align:center;font-size:11px;color:var(--ink-soft);margin:22px 0 6px;line-height:1.6}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-inner">
      <div class="brand">
        <span class="logo">📜</span>
        <div>
          <div class="name">箴的懂了嗎？</div>
          <div class="sub" id="brandSub">智慧比銀子更值得尋找</div>
        </div>

/* =====================================================================
   ☁️ 雲端層（Firebase Firestore）
   本機仍是即時快取；雲端只是把「名單/題庫/設定/全班分數」同步給大家。
   沒填 firebaseConfig 或 CLOUD_ENABLED=false 時，整個 App 就是單機模式。
   ===================================================================== */
let cloudStudents = null;   // 雲端讀回的全班（用於排行榜）
const Cloud = {
  on:false, db:null,
  init(){
    if(!CONFIG.CLOUD_ENABLED) return;
    if(typeof firebase==="undefined" || !firebaseConfig.projectId){ console.warn("雲端未啟用：Firebase 未載入或 firebaseConfig 未填"); return; }
    try{
      firebase.initializeApp(firebaseConfig);
      this.db=firebase.firestore();
      this.on=true;
      this.watch();
      console.log("☁️ 雲端已連線");
    }catch(e){ console.warn("Firebase 初始化失敗：",e); this.on=false; }
  },
  watch(){
    const d=this.db;
    d.doc("meta/roster").onSnapshot(s=>{ const v=s.data(); if(v&&v.data){ roster=v.data; syncTeams(); if(state) renderAll(); else if(document.getElementById("grpPick")) openOnboarding(); } }, e=>console.warn(e));
    d.doc("meta/questions").onSnapshot(s=>{ const v=s.data(); if(v&&v.data){ questions=v.data; if(state) renderToday(); } }, e=>console.warn(e));
    d.doc("meta/config").onSnapshot(s=>{ const v=s.data(); if(v&&v.START_DATE){ runtimeConfig.START_DATE=v.START_DATE; if(state) renderAll(); } }, e=>console.warn(e));
    d.collection(STUDENTS_COL).onSnapshot(snap=>{ const a=[]; snap.forEach(x=>a.push(x.data())); cloudStudents=a; if(state) renderRank(); }, e=>console.warn(e));
  },
  push(kind,data){
    if(!this.on) return;
    try{
      if(kind==="student"){ this.db.doc(STUDENTS_COL+"/"+data.sid).set(pubStudent(data)); }
      else if(kind==="roster"){ this.db.doc("meta/roster").set({data}); }
      else if(kind==="questions"){ this.db.doc("meta/questions").set({data}); }
      else if(kind==="config"){ this.db.doc("meta/config").set(data,{merge:true}); }
    }catch(e){ console.warn("雲端寫入失敗：",e); }
  },
  seedAll(){   // 用「檔案內建」的名單+題庫+開始日期覆蓋雲端（第一次設定 / 大更新用）
    if(!this.on){ alert("雲端尚未連線，請先確認 firebaseConfig 已填、CLOUD_ENABLED 已設 true"); return; }
    const r = SEED_ROSTER.map(g=>({name:g.name,members:g.members.slice()}));
    this.db.doc("meta/roster").set({data:r});
    this.db.doc("meta/questions").set({data:SEED_QUESTIONS});
    this.db.doc("meta/config").set({START_DATE:runtimeConfig.START_DATE},{merge:true});
    roster=r; questions=SEED_QUESTIONS.slice(); DB.saveRoster(roster); DB.saveQuestions(questions);
    alert("已用『檔案內建』的名單＋題庫覆蓋雲端 ✓ 全班都會同步到這一份。");
  },
  async clearAllStudents(){   // 老師：清空全班分數（保留名單與題庫）
    if(!this.on) throw new Error("雲端未連線");
    const snap=await this.db.collection(STUDENTS_COL).get();
    const batch=this.db.batch();
    snap.forEach(d=>batch.delete(d.ref));
    await batch.commit();
  },
};
// 只把「排行榜需要」的欄位放上雲端；個人回應(reflection)不上傳，保持私密
function pubStudent(s){ return { sid:s.sid, name:s.name||"", zh:s.zh||"", team:s.team||"", points:s.points||0, streak:s.streak||0, longest:s.longest||0, answered:s.answered||0, correct:s.correct||0, lastCheckin:s.lastCheckin||null, updated:Date.now() }; }

/* =====================================================================
   工具：日期(台灣)、種子亂數(每人打亂選項)
   ===================================================================== */
function todayTW(){ return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Taipei"}); } // YYYY-MM-DD
function diffDays(a,b){ return Math.round((Date.parse(b+"T00:00:00+08:00")-Date.parse(a+"T00:00:00+08:00"))/86400000); }
function currentDay(){ const d=diffDays(runtimeConfig.START_DATE, todayTW())+1; return d; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
// 依 (學生id + 天) 打亂選項，回傳打亂後的原始索引 [{orig}]（文字依當前語言再取）
function shuffledOptions(q, sid){
  const rnd=mulberry32(hashStr(sid+"#"+q.day));
  const arr=q.options.map((_,orig)=>({orig}));
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

/* ---------- 主題 ---------- */
function initTheme(){ const t=Store.get("proverbs.theme"); if(t) document.documentElement.setAttribute("data-theme",t); syncThemeIcon(); }
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const isDark = cur==="dark" || (!cur && matchMedia("(prefers-color-scheme:dark)").matches);
  const nx=isDark?"light":"dark";
  document.documentElement.setAttribute("data-theme",nx); Store.set("proverbs.theme",nx); syncThemeIcon();
}
function syncThemeIcon(){
  const cur=document.documentElement.getAttribute("data-theme");
  const isDark = cur==="dark" || (!cur && matchMedia("(prefers-color-scheme:dark)").matches);
  document.getElementById("themeBtn").textContent = isDark?"☀️":"🌙";
}

/* ---------- 分頁 ---------- */
function bindNav(){
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
}
function switchTab(t){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===t));
  document.getElementById("view-today").hidden = t!=="today";
  document.getElementById("view-rank").hidden  = t!=="rank";
  document.getElementById("view-me").hidden    = t!=="me";
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- 今日 ---------- */
function renderToday(){
  const host=document.getElementById("view-today");
  const cd=currentDay();
  // 尚未開始
  if(cd<1){
    host.innerHTML=`<div class="card"><div class="eyebrow">✨ 即將開始</div>
      <h2 class="section-title">尋寶之旅還沒開始</h2>
      <p class="muted">計畫從 ${runtimeConfig.START_DATE} 開始，到時候每天會有一章箴言等你。先揪好小組夥伴吧！</p></div>`;
    return;
  }
  const maxDay=Math.max(0,...questions.map(q=>q.day));
  const openDay=Math.min(cd,maxDay);           // 目前最多開放到第幾天
  const viewDay = host.dataset.viewDay ? +host.dataset.viewDay : openDay;
  const q=questions.find(x=>x.day===viewDay);

  // 進度列（可點過去補讀）
  let chips="";
  for(let d=1; d<=Math.max(openDay,maxDay); d++){
    const has=questions.some(x=>x.day===d);
    const done=state.days[d];
    const isToday=d===cd;
    const locked=d>openDay;
    let cls="day-chip"; if(done)cls+=" done"; if(isToday)cls+=" today"; if(locked||!has)cls+=" locked";
    chips+=`<button class="${cls}" ${(locked||!has)?"disabled":""} data-goday="${d}">
      ${done?"✓":d}<span class="dl">${isToday?"今天":("第"+d+"天")}</span></button>`;
  }

  if(!q){
    host.innerHTML=`<div class="card"><div class="eyebrow">📖 今日靈糧</div>
      <h2 class="section-title">第 ${cd} 天的題目還沒放上來</h2>
      <p class="muted">VT 還在準備今天的箴言，晚點再來看看 🙏</p></div>
      <div class="card"><div class="eyebrow">📅 我的進度</div><div class="days">${chips}</div></div>`;
    bindDayChips(host); return;
  }

  const ans=state.days[viewDay];
  const opts=shuffledOptions(q,state.sid);
  const isToday=viewDay===cd;

  let optHtml=opts.map((o,i)=>{
    const key=String.fromCharCode(65+i);
    let cls="opt";
    if(ans){
      if(o.orig===q.answer) cls+=" correct";
      else if(o.orig===ans.sel) cls+=" wrong";
    }
    const mark = ans ? (o.orig===q.answer?'<span class="mark">✓</span>':(o.orig===ans.sel?'<span class="mark">✗</span>':'')) : '';
    const oEn = (q.optionsEn&&q.optionsEn[o.orig]) ? `<span class="opt-en">${esc(q.optionsEn[o.orig])}</span>` : "";
    return `<button class="${cls}" ${ans?"disabled":""} data-pick="${o.orig}">
      <span class="key">${key}</span><span class="opt-txt">${esc(q.options[o.orig])}${oEn}</span>${mark}</button>`;
  }).join("");

  const chapLine = `${esc(q.chapter)}${q.chapterEn?" · "+esc(q.chapterEn):""}`;
  const qEnLine = q.qEn ? `<div class="q-text-en">${esc(q.qEn)}</div>` : "";
  host.innerHTML=`
    <div class="card">
      <div class="q-head">
        <span class="q-day">${isToday?"今日靈糧 · ":""}第 ${viewDay} 天</span>
        <span class="q-chapter">${chapLine}</span>
      </div>
      <div class="q-text">${esc(q.q)}</div>
      ${qEnLine}
      <div class="opts" id="opts">${optHtml}</div>
      ${ans?"":`<button class="btn" id="submitBtn" disabled>送出答案 Submit（每天一次）</button>`}
      <div id="revealBox"></div>
    </div>
    <div class="card">
      <div class="eyebrow">📅 我的進度 <span class="muted" style="font-weight:400;letter-spacing:0">· 點數字可補讀前幾天</span></div>
      <div class="days">${chips}</div>
    </div>
  `;

  if(!ans){
    let picked=null;
    host.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>{
      picked=+b.dataset.pick;
      host.querySelectorAll("#opts .opt").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel");
      document.getElementById("submitBtn").disabled=false;
    });
    document.getElementById("submitBtn").onclick=()=>submitAnswer(viewDay,picked,isToday);
  } else {
    renderReveal(q,viewDay,ans);
  }
  bindDayChips(host);
}
function bindDayChips(host){
  host.querySelectorAll("[data-goday]").forEach(b=>b.onclick=()=>{ host.dataset.viewDay=b.dataset.goday; renderToday(); });
}

function submitAnswer(day,sel,isToday){
  const q=questions.find(x=>x.day===day);
  const correct = sel===q.answer;
  let gained, bonus=0;
  if(isToday){
    // 當天做：全額 + 連續加成
    gained = CONFIG.PTS_CHECKIN + (correct?CONFIG.PTS_CORRECT:0);
    const t=todayTW();
    if(state.lastCheckin!==t){
      if(state.lastCheckin && diffDays(state.lastCheckin,t)===1) state.streak+=1;
      else state.streak=1;
      state.lastCheckin=t;
      state.longest=Math.max(state.longest,state.streak);
      bonus=Math.min(state.streak,CONFIG.STREAK_CAP);
      gained+=bonus;
    }
  } else {
    // 補做前幾天：分數較少，不影響連續打卡
    gained = CONFIG.PTS_LATE_CHECKIN + (correct?CONFIG.PTS_LATE_CORRECT:0);
  }
  state.points+=gained;
  state.answered+=1; if(correct) state.correct+=1;
  state.days[day]={sel,correct,ts:Date.now(),reflection:"",gained,bonus,late:!isToday};
  checkBadges();
  DB.saveState(state);
  renderStats(); renderToday(); renderRank(); renderMe();
  if(correct) burstConfetti();
}

function renderReveal(q,day,ans){
  const box=document.getElementById("revealBox");
  const gnote = ans.gained ? `+${ans.gained} 分`+(ans.bonus?`（含連續 🔥+${ans.bonus}）`:(ans.late?`（補做）`:``)) : ``;
  const refLine = `${esc(q.ref)}${q.refEn?" · "+esc(q.refEn):""}`;
  const verseEnLine = q.verseEn ? `<div class="txt-en">${esc(q.verseEn)}</div>` : "";
  box.innerHTML=`
    <div class="reveal">
      <div class="verdict ${ans.correct?'ok':'no'}">
        ${ans.correct?'🎉 答對了！':'💛 沒關係，記住就好'}
        <span class="gained">${gnote}</span>
      </div>
      <div class="verse">
        <div class="ref">📖 ${refLine}</div>
        <div class="txt">「${esc(q.verse)}」</div>
        ${verseEnLine}
      </div>
      <div class="reflect">
        <label>今天這章有哪句話對你說話？ <span class="hint">（只有你看得到，不計分）</span></label>
        <textarea id="reflectBox" placeholder="寫一句就好，也可以不寫～">${esc(ans.reflection||"")}</textarea>
        <div class="saved-tag" id="savedTag">✓ 已存起來</div>
      </div>
    </div>`;
  const ta=document.getElementById("reflectBox");
  let tm=null;
  ta.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ state.days[day].reflection=ta.value; DB.saveState(state); const st=document.getElementById("savedTag"); st.classList.add("show"); setTimeout(()=>st.classList.remove("show"),1400); },500); };
}

function fmtAgo(ts){
  if(!ts) return "—";
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return "剛剛"; if(s<3600) return Math.floor(s/60)+" 分前";
  if(s<86400) return Math.floor(s/3600)+" 小時前"; return Math.floor(s/86400)+" 天前";
}
function renderVTDashboard(){
  if(!Cloud.on){
    return `<div class="demo-note" style="margin-top:0">👀 教師看板要<b>雲端連線</b>才能看全班。若你在 Claude 預覽視窗看是正常的——放到 github.io 用瀏覽器打開就會連上。</div>`;
  }
  const today=todayTW();
  const parts=cloudStudents||[];
  const doneToday=parts.filter(p=>p.lastCheckin===today).length;
  let html=`<div class="vt-sum">
      <div class="vt-s"><b>${parts.length}</b><span>已參加</span></div>
      <div class="vt-s"><b style="color:var(--sage)">${doneToday}</b><span>今天已打卡</span></div>
      <div class="vt-s"><b style="color:var(--fire)">${Math.max(0,parts.length-doneToday)}</b><span>今天還沒做</span></div>
    </div>`;
  const used=new Set();
  roster.forEach(g=>{
    const rows=g.members.map(m=>{
      const cs=parts.find(p=>p.team===g.name && !used.has(p.sid) && (p.name===m.en || p.name===m.zh));
      if(cs) used.add(cs.sid);
      const label=m.en||m.zh;
      if(!cs) return `<div class="vt-row off"><span class="vt-nm">${esc(label)}</span><span class="vt-tag">尚未加入</span></div>`;
      const acc=cs.answered?Math.round(cs.correct/cs.answered*100):0;
      const done=cs.lastCheckin===today;
      return `<div class="vt-row">
        <span class="vt-nm">${esc(cs.name)} ${done?'<span class="vt-ok">今日✓</span>':'<span class="vt-no">今日✗</span>'}</span>
        <span class="vt-st">${cs.answered||0}天 · 對${acc}% · 🔥${cs.streak||0} · ${cs.points||0}分 · ${fmtAgo(cs.updated)}</span>
      </div>`;
    }).join("");
    html+=`<div class="vt-group"><div class="vt-gname">${esc(g.name)}</div>${rows}</div>`;
  });
  const extras=parts.filter(p=>!used.has(p.sid));
  if(extras.length){
    const rows=extras.map(cs=>{
      const acc=cs.answered?Math.round(cs.correct/cs.answered*100):0;
      const done=cs.lastCheckin===today;
      return `<div class="vt-row"><span class="vt-nm">${esc(cs.name)} <span class="muted">(${esc(cs.team||'?')})</span> ${done?'<span class="vt-ok">今日✓</span>':'<span class="vt-no">今日✗</span>'}</span>
        <span class="vt-st">${cs.answered||0}天 · 對${acc}% · 🔥${cs.streak||0} · ${cs.points||0}分</span></div>`;
    }).join("");
    html+=`<div class="vt-group"><div class="vt-gname">新加入（不在名單上）</div>${rows}</div>`;
  }
  if(parts.length===0) html+=`<div class="empty small" style="padding:16px">還沒有人作答。等大家開始就會出現在這裡。</div>`;
  html+=`<button class="btn ghost" id="vtRefresh" style="margin-top:10px">🔄 重新整理看板</button>`;
  return html;
}
function rosterEditHTML(){
  const groups=roster.map((g,gi)=>`
    <div class="admin-q" data-gi="${gi}">
      <div class="r1">
        <input class="input gname" data-gi="${gi}" value="${esc(g.name)}" style="flex:1;padding:8px 10px;font-size:14px">
        <button class="icon-btn" style="width:30px;height:30px;font-size:14px" data-gdel="${gi}" title="刪除整組">🗑️</button>
      </div>
      <div class="mem-wrap">
        ${g.members.map((m,mi)=>`<span class="mem-chip">${esc(m.en||m.zh)}${(m.en&&m.zh)?` <i>${esc(m.zh)}</i>`:``}<button data-mdel="${gi}:${mi}" title="移除">×</button></span>`).join("") || '<span class="muted small">（尚無名單）</span>'}
      </div>
      <div class="opt-edit" style="margin-top:9px">
        <input class="input" type="text" id="amEn_${gi}" placeholder="英文名/暱稱">
        <input class="input" type="text" id="amZh_${gi}" placeholder="中文(可空)" style="max-width:108px">
        <button class="btn ghost" style="width:auto;margin:0;padding:9px 13px" data-madd="${gi}">＋</button>
      </div>
    </div>`).join("");
  return `<div id="rosterEdit">${groups}</div>
    <div class="opt-edit" style="margin-top:2px">
      <input class="input" type="text" id="newGroupName" placeholder="新增一個小組（輸入組名）">
      <button class="btn ghost" style="width:auto;margin:0;padding:9px 13px" id="addGroup">＋ 加組</button>
    </div>`;
}
function bindRosterEdit(){
  document.querySelectorAll("#rosterEdit .gname").forEach(inp=>inp.onchange=()=>{
    const gi=+inp.dataset.gi, nv=inp.value.trim(); if(!nv)return;
    const old=roster[gi].name; roster[gi].name=nv;
    if(state && state.team===old){ state.team=nv; DB.saveState(state); }
    DB.saveRoster(roster); syncTeams(); renderAll();
  });
  document.querySelectorAll("[data-gdel]").forEach(b=>b.onclick=()=>{
    const gi=+b.dataset.gdel;
    if(confirm(`刪除整組「${roster[gi].name}」？名單會一起刪除。`)){ roster.splice(gi,1); DB.saveRoster(roster); syncTeams(); adminPanel(); }
  });
  document.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=()=>{
    const [gi,mi]=b.dataset.mdel.split(":").map(Number);
    roster[gi].members.splice(mi,1); DB.saveRoster(roster); adminPanel();
  });
  document.querySelectorAll("[data-madd]").forEach(b=>b.onclick=()=>{
    const gi=+b.dataset.madd;
    const en=document.getElementById("amEn_"+gi).value.trim(), zh=document.getElementById("amZh_"+gi).value.trim();
    if(!en&&!zh)return; roster[gi].members.push({zh,en}); DB.saveRoster(roster); adminPanel();
  });
  const ag=document.getElementById("addGroup"); if(ag) ag.onclick=()=>{
    const nm=document.getElementById("newGroupName").value.trim(); if(!nm)return;
    roster.push({name:nm,members:[]}); DB.saveRoster(roster); syncTeams(); adminPanel();
  };
}
function askAdmin(){
  showSheet(`<h2>VT 管理 ⚙️</h2>
    <p class="lead">輸入管理密碼進入（可看全班進度、設定開始日期、小組、每日題目）。</p>
    <div class="field"><label>密碼</label><input class="input" id="admPw" type="password" placeholder="預設是 CONFIG 裡的密碼"></div>
    <button class="btn" id="admGo">進入</button>`);
  document.getElementById("admGo").onclick=()=>{
    if(document.getElementById("admPw").value===CONFIG.ADMIN_CODE) adminPanel();
    else { alert("密碼不對喔"); }
  };
  document.getElementById("admPw").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("admGo").click(); });
}
function adminPanel(){
  const qs=questions.slice().sort((a,b)=>a.day-b.day);
  const list=qs.map(q=>`
    <div class="admin-q" data-day="${q.day}">
      <div class="r1"><span class="d">第 ${q.day} 天</span><span class="small muted">${esc(q.chapter)}</span>
        <button class="icon-btn small" style="margin-left:auto;width:30px;height:30px" data-del="${q.day}" title="刪除">🗑️</button></div>
      <div class="small">${esc(q.q)}</div>
      <div class="small muted" style="margin-top:4px">✓ ${esc(q.options[q.answer])} ｜ ${esc(q.ref)}</div>
    </div>`).join("") || '<p class="muted small">還沒有題目，往下新增第一題。</p>';

  showSheet(`
    <h2>VT 管理 ⚙️</h2>
    <button class="btn ghost" id="vtPreview" style="margin-top:12px">👁️ 預覽學生畫面／今天的題目（不計分）</button>
    <h2 style="font-size:18px;margin-top:16px">📊 教師看板</h2>
    <p class="lead small" style="margin:6px 0 10px">全班即時進度、今天誰還沒做。</p>
    ${renderVTDashboard()}
    <hr class="sep">
    <div class="field"><label>計畫開始日期（第 1 天）</label>
      <input class="input" id="cfgStart" type="date" value="${runtimeConfig.START_DATE}"></div>
    <button class="btn ghost" id="cfgSave">儲存開始日期</button>

    <hr class="sep">
    <h2 style="font-size:18px">👥 小組與名單</h2>
    <p class="lead small" style="margin:6px 0 12px">改組名、加減學生都在這裡。學生報名時就是從這份名單點自己的名字。</p>
    ${rosterEditHTML()}

    <hr class="sep">
    <h2 style="font-size:18px">📚 題庫（${qs.length} 題）</h2>
    <div id="qlist" style="margin-top:12px">${list}</div>

    <hr class="sep">
    <h2 style="font-size:18px">➕ 新增 / 修改一題</h2>
    <div class="field"><label>第幾天</label><input class="input" id="qDay" type="number" min="1" value="${(Math.max(0,...qs.map(q=>q.day))+1)}"></div>
    <div class="field"><label>章 (顯示用)</label><input class="input" id="qChap" placeholder="例如：箴言 4 章"></div>
    <div class="field"><label>題目</label><input class="input" id="qText" placeholder="輸入題目"></div>
    <div class="field"><label>四個選項（點左邊圓圈選正解）</label>
      ${[0,1,2,3].map(i=>`<div class="opt-edit">
        <input type="radio" name="qans" value="${i}" ${i===0?'checked':''}>
        <input class="input" type="text" id="qo${i}" placeholder="選項 ${String.fromCharCode(65+i)}"></div>`).join("")}
    </div>
    <div class="field"><label>經文出處</label><input class="input" id="qRef" placeholder="例如：箴言 4:23"></div>
    <div class="field"><label>經文內容</label><textarea id="qVerse" placeholder="貼上這節經文"></textarea></div>
    <button class="btn" id="qAdd">加入題庫</button>

    <hr class="sep">
    <h2 style="font-size:18px">☁️ 雲端同步</h2>
    <div class="demo-note" style="margin-top:10px">
      狀態：${Cloud.on
        ? '<b style="color:var(--sage)">已連線 ✓</b>　名單、題庫、全班分數都會即時同步。'
        : '<b>未連線</b>（目前存在這台裝置）。填好檔案裡的 firebaseConfig、把 CLOUD_ENABLED 改成 true 後就會連上。'}
    </div>
    <button class="btn ghost" id="cloudSeed" style="margin-top:10px" ${Cloud.on?'':'disabled'}>⬆️ 用檔案的名單＋題庫覆蓋雲端（第一次設定 / 大更新）</button>
    <button class="btn ghost" id="cloudSyncQ" style="margin-top:8px" ${Cloud.on?'':'disabled'}>🔄 用檔案內建題庫更新雲端題目（加了新題目後按）</button>
    <button class="btn ghost" id="cloudClear" style="margin-top:8px;color:var(--wrong)" ${Cloud.on?'':'disabled'}>🗑️ 清空全班分數（測試完重設用）</button>
    ${Cloud.on?'':'<div class="footnote" style="margin-top:8px;text-align:left">↑ 這三顆要在 github.io 上、雲端「已連線 ✓」後才能按（Claude 預覽視窗連不上雲端，所以是灰色的）。</div>'}
    <div class="footnote" style="margin-top:16px">💡 之後要加整個月的題目：把題目給 Claude 加進檔案的 SEED_QUESTIONS，重新上傳檔案，再按上面的「🔄」一次即可（名單與分數不受影響）。</div>
  `);
  const cs=document.getElementById("cloudSeed"); if(cs) cs.onclick=()=>Cloud.seedAll();
  const cq=document.getElementById("cloudSyncQ"); if(cq) cq.onclick=()=>{
    if(confirm("用這個檔案內建的題庫，覆蓋雲端目前的題目？（名單與分數不受影響）")){
      questions=SEED_QUESTIONS.slice(); DB.saveQuestions(questions); adminPanel(); renderToday();
      alert("已用檔案題庫更新雲端 ✓");
    }
  };
  const cc=document.getElementById("cloudClear"); if(cc) cc.onclick=async()=>{
    if(!confirm("確定清空『全班所有人』的分數與答題紀錄？名單與題庫會保留，此動作無法復原。")) return;
    if(!confirm("再確認一次：真的要清空全班分數嗎？")) return;
    cc.disabled=true; cc.textContent="清除中…";
    try{ await Cloud.clearAllStudents(); alert("已清空雲端全班分數 ✓\n\n提醒：每一台測試過的手機，請各自到「成就」分頁按『清除這台紀錄』，才不會又把舊分數傳回來。"); }
    catch(e){ alert("清除失敗："+(e.message||e)); }
    cc.disabled=false; cc.textContent="🗑️ 清空全班分數（測試完重設用）";
  };

  // 設定
  document.getElementById("cfgSave").onclick=()=>{
    runtimeConfig.START_DATE=document.getElementById("cfgStart").value||runtimeConfig.START_DATE;
    DB.saveConfig({START_DATE:runtimeConfig.START_DATE}); alert("開始日期已儲存 ✓"); renderAll();
  };
  bindRosterEdit();
  const vp=document.getElementById("vtPreview"); if(vp) vp.onclick=enterVTPreview;
  const vr=document.getElementById("vtRefresh"); if(vr) vr.onclick=()=>adminPanel();
  // 刪除
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(confirm("刪除第 "+b.dataset.del+" 天的題目？")){ questions=questions.filter(q=>q.day!==+b.dataset.del); DB.saveQuestions(questions); adminPanel(); renderToday(); }
  });
  // 點題庫項目→帶入編輯
  document.querySelectorAll(".admin-q").forEach(el=>el.onclick=e=>{
    if(e.target.closest("[data-del]"))return;
    const q=questions.find(x=>x.day===+el.dataset.day); if(!q)return;
    document.getElementById("qDay").value=q.day;
    document.getElementById("qChap").value=q.chapter;
    document.getElementById("qText").value=q.q;
    q.options.forEach((o,i)=>document.getElementById("qo"+i).value=o);
    document.querySelector(`input[name=qans][value="${q.answer}"]`).checked=true;
    document.getElementById("qRef").value=q.ref;
    document.getElementById("qVerse").value=q.verse;
    document.getElementById("qAdd").scrollIntoView({behavior:"smooth"});
  });
  // 新增/修改
  document.getElementById("qAdd").onclick=()=>{
    const day=+document.getElementById("qDay").value;
    const opts=[0,1,2,3].map(i=>document.getElementById("qo"+i).value.trim());
    const text=document.getElementById("qText").value.trim();
    if(!day||!text||opts.some(o=>!o)){ alert("請填第幾天、題目、以及四個選項"); return; }
    const ans=+document.querySelector("input[name=qans]:checked").value;
    const nq={day,chapter:document.getElementById("qChap").value.trim()||("箴言 "+day+" 章"),q:text,options:opts,answer:ans,ref:document.getElementById("qRef").value.trim(),verse:document.getElementById("qVerse").value.trim()};
    questions=questions.filter(q=>q.day!==day); questions.push(nq); DB.saveQuestions(questions);
    adminPanel(); renderToday();
  };
}

/* =====================================================================
   小工具：sheet 開關、跳脫、彩帶
   ===================================================================== */
function showSheet(html, dismissable=true){
  const sh=document.getElementById("sheet"); sh.innerHTML=html;
  document.getElementById("overlay").classList.add("show");
  document.getElementById("overlay").dataset.dismiss = dismissable?"1":"0";
}
function closeSheet(){
  if(document.getElementById("overlay").dataset.dismiss==="0" && !state) return; // 報名未完成不可關
  document.getElementById("overlay").classList.remove("show");
  const host=document.getElementById("view-today"); if(host) delete host.dataset.viewDay;
  if(!state) openOnboarding();   // VT 看完管理、沒有學生身分 → 回到報名畫面
}
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* 彩帶（答對時） */
function burstConfetti(){
  const cv=document.getElementById("confetti"); const ctx=cv.getContext("2d");
  cv.style.display="block"; cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#C48A16","#E8B84B","#5F7E56","#E4622E","#7C6FD6"];
  const P=[]; for(let i=0;i<90;i++)P.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*9,vy:Math.random()*-11-4,r:Math.random()*6+3,c:cols[i%cols.length],a:1,rot:Math.random()*6});
  let f=0;
  (function anim(){
    ctx.clearRect(0,0,cv.width,cv.height); f++;
    P.forEach(p=>{ p.vy+=.42; p.x+=p.vx; p.y+=p.vy; p.rot+=.2; p.a-=.008;
      ctx.save(); ctx.globalAlpha=Math.max(0,p.a); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); ctx.restore(); });
    if(f<130 && !matchMedia("(prefers-reduced-motion:reduce)").matches) requestAnimationFrame(anim);
    else { cv.style.display="none"; ctx.clearRect(0,0,cv.width,cv.height); }
  })();
}
